name: Examples CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  TOKA_VERSION: v1.0.0-rc.4
  TOKA_ARCHIVE: toka-v1.0.0-rc.4-linux-x64.tar.gz
  TOKA_ARCHIVE_SHA256: fee16678f67bb88ace9b0f31603f9b56a24802de6d16a5bca60b3714dd4d30f6

jobs:
  registry-consumers:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native package dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update -o Acquire::Retries=5
          sudo apt-get install -y curl lsb-release pkg-config software-properties-common wget \
            zlib1g-dev libzstd-dev libssl-dev libsqlite3-dev
          wget --timeout=15 --tries=3 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo -E ./llvm.sh 20
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"
          echo "CC=clang-20" >> "$GITHUB_ENV"

      - name: Install locked Toka SDK
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/$TOKA_ARCHIVE" \
            "https://github.com/tokalang/toka/releases/download/$TOKA_VERSION/$TOKA_ARCHIVE"
          echo "$TOKA_ARCHIVE_SHA256  $RUNNER_TEMP/$TOKA_ARCHIVE" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$TOKA_ARCHIVE" -C "$RUNNER_TEMP"
          sdk="$RUNNER_TEMP/${TOKA_ARCHIVE%.tar.gz}"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          echo "TOKA_LIB=$sdk/lib" >> "$GITHUB_ENV"

      - name: Build and run regex registry consumer
        working-directory: registry_regex_consumer
        run: |
          set -euo pipefail
          toka build
          ./target/debug/registry_regex_consumer

      - name: Replay regex lock offline
        working-directory: registry_regex_consumer
        run: |
          set -euo pipefail
          rm -rf target .toka/packages
          TOKA_OFFLINE=1 toka build
          ./target/debug/registry_regex_consumer

      - name: Resolve and run compression registry consumer from a fresh cache
        working-directory: registry_compress_consumer
        run: |
          set -euo pipefail
          rm -rf target .toka
          toka fetch
          cp package.lock "$RUNNER_TEMP/registry-compress-package.lock"
          toka build
          ./target/debug/registry_compress_consumer

      - name: Replay compression lock offline from the cached archive
        working-directory: registry_compress_consumer
        run: |
          set -euo pipefail
          test -n "$(find .toka/cache/archives -type f -print -quit)"
          rm -rf target .toka/packages
          TOKA_OFFLINE=1 toka fetch
          cmp package.lock "$RUNNER_TEMP/registry-compress-package.lock"
          TOKA_OFFLINE=1 toka build
          cmp package.lock "$RUNNER_TEMP/registry-compress-package.lock"
          ./target/debug/registry_compress_consumer

      - name: Resolve and run SQLite registry consumer from a fresh cache
        working-directory: registry_sqlite_consumer
        run: |
          set -euo pipefail
          rm -rf target .toka
          toka fetch
          cp package.lock "$RUNNER_TEMP/registry-sqlite-package.lock"
          test -f .toka/packages/sqlite-0.1.0/native/sqlite_preflight.c
          toka build
          test -n "$(find .toka/build/native -type f -name 'sqlite_preflight-*.o' -print -quit)"
          ./target/debug/registry_sqlite_consumer

      - name: Replay SQLite lock offline and rebuild its native object
        working-directory: registry_sqlite_consumer
        run: |
          set -euo pipefail
          test -n "$(find .toka/cache/archives -type f -print -quit)"
          rm -rf target .toka/packages .toka/build
          test ! -e .toka/build
          TOKA_OFFLINE=1 toka fetch
          cmp package.lock "$RUNNER_TEMP/registry-sqlite-package.lock"
          test -f .toka/packages/sqlite-0.1.0/native/sqlite_preflight.c
          test ! -e .toka/build/native
          TOKA_OFFLINE=1 toka build
          cmp package.lock "$RUNNER_TEMP/registry-sqlite-package.lock"
          test -n "$(find .toka/build/native -type f -name 'sqlite_preflight-*.o' -print -quit)"
          ./target/debug/registry_sqlite_consumer

      - name: Resolve and run PostgreSQL registry consumer from a fresh cache
        working-directory: registry_postgres_consumer
        run: |
          set -euo pipefail
          rm -rf target .toka
          toka fetch
          cp package.lock "$RUNNER_TEMP/registry-postgres-package.lock"
          test -f .toka/packages/postgres-0.1.0/lib/official/postgres.tk
          toka build
          ./target/debug/registry_postgres_consumer

      - name: Replay PostgreSQL lock offline from the cached archive
        working-directory: registry_postgres_consumer
        run: |
          set -euo pipefail
          test -n "$(find .toka/cache/archives -type f -print -quit)"
          rm -rf target .toka/packages .toka/build
          test ! -e .toka/build
          TOKA_OFFLINE=1 toka fetch
          cmp package.lock "$RUNNER_TEMP/registry-postgres-package.lock"
          test -f .toka/packages/postgres-0.1.0/lib/official/postgres.tk
          TOKA_OFFLINE=1 toka build
          cmp package.lock "$RUNNER_TEMP/registry-postgres-package.lock"
          ./target/debug/registry_postgres_consumer
