          cp "$archive" ".toka/cache/archives/$REDIS_ARCHIVE_SHA256.tar.gz"
          test ! -e target
          test ! -e .toka/packages
          test ! -e .toka/build
          test ! -e .toka_build_exe
          test "$(find .toka -type f | wc -l | tr -d ' ')" = 1
          echo "$REDIS_ARCHIVE_SHA256  .toka/cache/archives/$REDIS_ARCHIVE_SHA256.tar.gz" | sha256sum --check --strict
          TOKA_OFFLINE=1 toka fetch
          cmp package.lock "$RUNNER_TEMP/registry-redis-package.lock"
          test -f .toka/packages/redis-0.2.0/lib/official/redis.tk
          TOKA_OFFLINE=1 toka build
          cmp package.lock "$RUNNER_TEMP/registry-redis-package.lock"
          test -x target/debug/registry_redis_consumer
          ./target/debug/registry_redis_consumer

  rc6-release-consumers:
    runs-on: ubuntu-22.04
    env:
      TOKA_VERSION: v1.0.0-rc.6
      TOKA_ARCHIVE: toka-v1.0.0-rc.6-linux-x64.tar.gz
      TOKA_ARCHIVE_SHA256: 9a99343688a12f4422ddc7055e34f061fe3ae9e42abd3f91394421aedb415cf8
    steps:
      - uses: actions/checkout@v4

      - name: Install native package dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update -o Acquire::Retries=5
          sudo apt-get install -y curl lsb-release pkg-config software-properties-common wget \
            zlib1g-dev libzstd-dev libssl-dev libsqlite3-dev
          wget --timeout=15 --tries=3 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo -E ./llvm.sh 20
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"
          echo "CC=clang-20" >> "$GITHUB_ENV"

      - name: Install locked Toka RC6 SDK
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/$TOKA_ARCHIVE" \
            "https://github.com/tokalang/toka/releases/download/$TOKA_VERSION/$TOKA_ARCHIVE"
          echo "$TOKA_ARCHIVE_SHA256  $RUNNER_TEMP/$TOKA_ARCHIVE" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$TOKA_ARCHIVE" -C "$RUNNER_TEMP"
          sdk="$RUNNER_TEMP/${TOKA_ARCHIVE%.tar.gz}"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          echo "TOKA_SDK=$sdk" >> "$GITHUB_ENV"
          echo "TOKA_LIB=$sdk/lib" >> "$GITHUB_ENV"

      - name: Assert Toka RC6 Toolchain Baseline
        run: |
          set -euo pipefail
          toka --version | grep -F "1.0.0-rc.6"
          tokac --version | grep -F "1.0.0-rc.6"

      - name: Verify sqlite@0.1.1 consumer on RC6 toolchain (Online & Offline)
        working-directory: registry_sqlite_consumer
        run: |
          set -euo pipefail
          python3 verify_consumer.py

      - name: Verify recursive migrate@0.1.1 application consumer on RC6 toolchain (Online & Offline)
        working-directory: migrate_app_consumer
        run: |
          set -euo pipefail
          python3 verify_consumer.py

      - name: Verify notifier@0.1.2 application consumer on RC6 toolchain (Online & Offline)
        working-directory: notifier_app_consumer
        run: |
          set -euo pipefail
          python3 verify_consumer.py

      - name: Verify webhook@0.1.1 application consumer on RC6 toolchain (Online & Offline)
        working-directory: webhook_app_consumer
        run: |
          set -euo pipefail
          python3 verify_consumer.py

      - name: Verify composed release pipeline via task-runner@0.1.2 (DAG orchestration)
        working-directory: composed_release_pipeline
        run: |
          set -euo pipefail
          python3 verify_composed.py

