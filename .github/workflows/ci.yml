name: Examples CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  TOKA_VERSION: v1.0.0-rc.4
  TOKA_ARCHIVE: toka-v1.0.0-rc.4-linux-x64.tar.gz
  TOKA_ARCHIVE_SHA256: fee16678f67bb88ace9b0f31603f9b56a24802de6d16a5bca60b3714dd4d30f6
  ROUTER_ARCHIVE_SHA256: efc154757556e37ffbc7891481c6031ccc6b0161e3ea391e4a100080e407ed78
  ROUTER_CONTENT_SHA256: f5dcfab01ba3e4dbecbcea5e334673c3fc5fdf1b95c76f1c90d0c55ae30d0a1c
  OPENAI_COMPAT_ARCHIVE_SHA256: 8c3d139e0a4147f0f6bfcc73da623a5eeac670543af86468350c27fb5c13a457
  OPENAI_COMPAT_CONTENT_SHA256: b4a4274ef34ac6773a95ca0cdc5974d38987bb29dcba4e35820c51fc857f2a35

jobs:
  registry-consumers:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native package dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update -o Acquire::Retries=5
          sudo apt-get install -y curl lsb-release pkg-config software-properties-common wget \
            zlib1g-dev libzstd-dev libssl-dev libsqlite3-dev
          wget --timeout=15 --tries=3 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo -E ./llvm.sh 20
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"
          echo "CC=clang-20" >> "$GITHUB_ENV"

      - name: Install locked Toka SDK
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/$TOKA_ARCHIVE" \
            "https://github.com/tokalang/toka/releases/download/$TOKA_VERSION/$TOKA_ARCHIVE"
          echo "$TOKA_ARCHIVE_SHA256  $RUNNER_TEMP/$TOKA_ARCHIVE" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$TOKA_ARCHIVE" -C "$RUNNER_TEMP"
          sdk="$RUNNER_TEMP/${TOKA_ARCHIVE%.tar.gz}"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          echo "TOKA_LIB=$sdk/lib" >> "$GITHUB_ENV"

      - name: Build and run regex registry consumer
        working-directory: registry_regex_consumer
        run: |
          set -euo pipefail
          toka build
          ./target/debug/registry_regex_consumer

      - name: Replay regex lock offline
        working-directory: registry_regex_consumer
        run: |
          set -euo pipefail
          rm -rf target .toka/packages
          TOKA_OFFLINE=1 toka build
          ./target/debug/registry_regex_consumer

      - name: Resolve and run Router registry consumer from a fresh cache
        working-directory: registry_router_consumer
        run: |
          set -euo pipefail
          rm -rf target .toka
          rm -f .toka_build_exe
          cp package.lock "$RUNNER_TEMP/registry-router-package.lock"
          test "$(sed -n '1p' package.lock)" = "toka-lock-v1"
          test "$(wc -l < package.lock | tr -d ' ')" = 2
          expected="$(printf 'package\trouter\tregistry\trouter\t0.1.0\t%s\t%s\t-' \
            "$ROUTER_ARCHIVE_SHA256" "$ROUTER_CONTENT_SHA256")"
          test "$(sed -n '2p' package.lock)" = "$expected"
          toka fetch
          cmp package.lock "$RUNNER_TEMP/registry-router-package.lock"
          test "$(find .toka/cache/archives -type f | wc -l | tr -d ' ')" = 1
          test -f ".toka/cache/archives/$ROUTER_ARCHIVE_SHA256.tar.gz"
          echo "$ROUTER_ARCHIVE_SHA256  .toka/cache/archives/$ROUTER_ARCHIVE_SHA256.tar.gz" | sha256sum --check --strict
          test -f .toka/packages/router-0.1.0/lib/official/router.tk
          toka build
          cmp package.lock "$RUNNER_TEMP/registry-router-package.lock"
          test -x target/debug/registry_router_consumer
          ./target/debug/registry_router_consumer

      - name: Replay Router lock offline from its archive only
        working-directory: registry_router_consumer
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/router-$ROUTER_ARCHIVE_SHA256.tar.gz"
          cp ".toka/cache/archives/$ROUTER_ARCHIVE_SHA256.tar.gz" "$archive"
          rm -rf target .toka
          rm -f .toka_build_exe
          mkdir -p .toka/cache/archives
          cp "$archive" ".toka/cache/archives/$ROUTER_ARCHIVE_SHA256.tar.gz"
          test ! -e target
          test ! -e .toka/packages
          test ! -e .toka/build
          test ! -e .toka_build_exe
          test "$(find .toka -type f | wc -l | tr -d ' ')" = 1
          echo "$ROUTER_ARCHIVE_SHA256  .toka/cache/archives/$ROUTER_ARCHIVE_SHA256.tar.gz" | sha256sum --check --strict
          TOKA_OFFLINE=1 toka fetch
          cmp package.lock "$RUNNER_TEMP/registry-router-package.lock"
          test -f .toka/packages/router-0.1.0/lib/official/router.tk
          TOKA_OFFLINE=1 toka build
          cmp package.lock "$RUNNER_TEMP/registry-router-package.lock"
          test -x target/debug/registry_router_consumer
          ./target/debug/registry_router_consumer

      - name: Resolve and run OpenAI-compatible registry consumer from a fresh cache
        working-directory: registry_openai_compat_consumer
        run: |
          set -euo pipefail
          rm -rf target .toka
          rm -f .toka_build_exe
          cp package.lock "$RUNNER_TEMP/registry-openai-compat-package.lock"
          test "$(sed -n '1p' package.lock)" = "toka-lock-v1"
          test "$(wc -l < package.lock | tr -d ' ')" = 2
          expected="$(printf 'package\topenai_compat\tregistry\topenai_compat\t0.1.1\t%s\t%s\t-' \
            "$OPENAI_COMPAT_ARCHIVE_SHA256" "$OPENAI_COMPAT_CONTENT_SHA256")"
          test "$(sed -n '2p' package.lock)" = "$expected"
          toka fetch
          cmp package.lock "$RUNNER_TEMP/registry-openai-compat-package.lock"
          test "$(find .toka/cache/archives -type f | wc -l | tr -d ' ')" = 1
          test -f ".toka/cache/archives/$OPENAI_COMPAT_ARCHIVE_SHA256.tar.gz"
          echo "$OPENAI_COMPAT_ARCHIVE_SHA256  .toka/cache/archives/$OPENAI_COMPAT_ARCHIVE_SHA256.tar.gz" | sha256sum --check --strict
          test -f .toka/packages/openai_compat-0.1.1/lib/official/openai_compat.tk
          toka build
          cmp package.lock "$RUNNER_TEMP/registry-openai-compat-package.lock"
          test -x target/debug/registry_openai_compat_consumer
          ./target/debug/registry_openai_compat_consumer

      - name: Replay OpenAI-compatible lock offline from its archive only
        working-directory: registry_openai_compat_consumer
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/openai-compat-$OPENAI_COMPAT_ARCHIVE_SHA256.tar.gz"
          cp ".toka/cache/archives/$OPENAI_COMPAT_ARCHIVE_SHA256.tar.gz" "$archive"
          rm -rf target .toka
          rm -f .toka_build_exe
          mkdir -p .toka/cache/archives
          cp "$archive" ".toka/cache/archives/$OPENAI_COMPAT_ARCHIVE_SHA256.tar.gz"
          test ! -e target
          test ! -e .toka/packages
          test ! -e .toka/build
          test ! -e .toka_build_exe
          test "$(find .toka -type f | wc -l | tr -d ' ')" = 1
          echo "$OPENAI_COMPAT_ARCHIVE_SHA256  .toka/cache/archives/$OPENAI_COMPAT_ARCHIVE_SHA256.tar.gz" | sha256sum --check --strict
          TOKA_OFFLINE=1 toka fetch
          cmp package.lock "$RUNNER_TEMP/registry-openai-compat-package.lock"
          test -f .toka/packages/openai_compat-0.1.1/lib/official/openai_compat.tk
          TOKA_OFFLINE=1 toka build
          cmp package.lock "$RUNNER_TEMP/registry-openai-compat-package.lock"
          test -x target/debug/registry_openai_compat_consumer
          ./target/debug/registry_openai_compat_consumer

      - name: Resolve and run compression registry consumer from a fresh cache
        working-directory: registry_compress_consumer
        run: |
          set -euo pipefail
          rm -rf target .toka
          toka fetch
          cp package.lock "$RUNNER_TEMP/registry-compress-package.lock"
          toka build
          ./target/debug/registry_compress_consumer

      - name: Replay compression lock offline from the cached archive
        working-directory: registry_compress_consumer
        run: |
          set -euo pipefail
          test -n "$(find .toka/cache/archives -type f -print -quit)"
          rm -rf target .toka/packages
          TOKA_OFFLINE=1 toka fetch
          cmp package.lock "$RUNNER_TEMP/registry-compress-package.lock"
          TOKA_OFFLINE=1 toka build
          cmp package.lock "$RUNNER_TEMP/registry-compress-package.lock"
          ./target/debug/registry_compress_consumer

      - name: Resolve and run SQLite registry consumer from a fresh cache
        working-directory: registry_sqlite_consumer
        run: |
          set -euo pipefail
          rm -rf target .toka
          toka fetch
          cp package.lock "$RUNNER_TEMP/registry-sqlite-package.lock"
          test -f .toka/packages/sqlite-0.1.1/native/sqlite_preflight.c
          toka build
          test -n "$(find .toka/build/native -type f -name 'sqlite_preflight-*.o' -print -quit)"
          ./target/debug/registry_sqlite_consumer

      - name: Replay SQLite lock offline and rebuild its native object
        working-directory: registry_sqlite_consumer
        run: |
          set -euo pipefail
          test -n "$(find .toka/cache/archives -type f -print -quit)"
          rm -rf target .toka/packages .toka/build
          test ! -e .toka/build
          TOKA_OFFLINE=1 toka fetch
          cmp package.lock "$RUNNER_TEMP/registry-sqlite-package.lock"
          test -f .toka/packages/sqlite-0.1.1/native/sqlite_preflight.c
          test ! -e .toka/build/native
          TOKA_OFFLINE=1 toka build
          cmp package.lock "$RUNNER_TEMP/registry-sqlite-package.lock"
          test -n "$(find .toka/build/native -type f -name 'sqlite_preflight-*.o' -print -quit)"
          ./target/debug/registry_sqlite_consumer

      - name: Resolve and run PostgreSQL registry consumer from a fresh cache
        working-directory: registry_postgres_consumer
        run: |
          set -euo pipefail
          rm -rf target .toka
          toka fetch
          cp package.lock "$RUNNER_TEMP/registry-postgres-package.lock"
          test -f .toka/packages/postgres-0.1.0/lib/official/postgres.tk
          toka build
          ./target/debug/registry_postgres_consumer

      - name: Replay PostgreSQL lock offline from the cached archive
        working-directory: registry_postgres_consumer
        run: |
          set -euo pipefail
          test -n "$(find .toka/cache/archives -type f -print -quit)"
          rm -rf target .toka/packages .toka/build
          test ! -e .toka/build
          TOKA_OFFLINE=1 toka fetch
          cmp package.lock "$RUNNER_TEMP/registry-postgres-package.lock"
          test -f .toka/packages/postgres-0.1.0/lib/official/postgres.tk
          TOKA_OFFLINE=1 toka build
          cmp package.lock "$RUNNER_TEMP/registry-postgres-package.lock"
          ./target/debug/registry_postgres_consumer

      - name: Resolve and run Unicode registry consumer from a fresh cache
        working-directory: registry_unicode_consumer
        run: |
          set -euo pipefail
          rm -rf target .toka
          toka fetch
          cp package.lock "$RUNNER_TEMP/registry-unicode-package.lock"
          test -f .toka/packages/unicode-0.1.1/LICENSE
          test -f .toka/packages/unicode-0.1.1/LICENSE-UNICODE
          test -d .toka/packages/unicode-0.1.1/data
          test -d .toka/packages/unicode-0.1.1/tools
          test -z "$(find .toka/packages/unicode-0.1.1 -name '._*' -print -quit)"
          toka build
          ./target/debug/registry_unicode_consumer

      - name: Replay Unicode lock offline from the cached archive
        working-directory: registry_unicode_consumer
        run: |
          set -euo pipefail
          test -n "$(find .toka/cache/archives -type f -print -quit)"
          rm -rf target .toka/packages .toka/build
          rm -f .toka_build_exe
          test ! -e target
          test ! -e .toka/packages
          test ! -e .toka/build
          test ! -e .toka_build_exe
          TOKA_OFFLINE=1 toka fetch
          cmp package.lock "$RUNNER_TEMP/registry-unicode-package.lock"
          test -f .toka/packages/unicode-0.1.1/LICENSE
          test -f .toka/packages/unicode-0.1.1/LICENSE-UNICODE
          test -d .toka/packages/unicode-0.1.1/data
          test -d .toka/packages/unicode-0.1.1/tools
          test -z "$(find .toka/packages/unicode-0.1.1 -name '._*' -print -quit)"
          TOKA_OFFLINE=1 toka build
          cmp package.lock "$RUNNER_TEMP/registry-unicode-package.lock"
          ./target/debug/registry_unicode_consumer

  registry-gui-consumer:
    name: GUI registry consumer (macos-arm64)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      TOKA_ARCHIVE: toka-v1.0.0-rc.4-macos-arm64.tar.gz
      TOKA_ARCHIVE_SHA256: f5e9043af6f650bca42e95d22fda28c6814413faa4bf9478decfeb884d4d0866

    steps:
      - uses: actions/checkout@v4

      - name: Install macOS dependencies
        run: |
          set -euo pipefail
          brew install lld@20 zstd openssl@3
          echo "CC=xcrun --sdk macosx clang" >> "$GITHUB_ENV"
          sdk_path="$(xcrun --show-sdk-path)"
          test -d "$sdk_path/System/Library/Frameworks/AppKit.framework"
          test -d "$sdk_path/System/Library/Frameworks/Metal.framework"
          test -d "$sdk_path/System/Library/Frameworks/QuartzCore.framework"

      - name: Install locked Toka SDK
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$TOKA_ARCHIVE"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/tokalang/toka/releases/download/$TOKA_VERSION/$TOKA_ARCHIVE"
          echo "$TOKA_ARCHIVE_SHA256  $archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sdk="$RUNNER_TEMP/${TOKA_ARCHIVE%.tar.gz}"
          test -x "$sdk/bin/toka"
          test -x "$sdk/bin/tokac"
          test -f "$sdk/lib/sys/toka_rt.o"
          test -f "$sdk/lib/toolchain/toka_build.py"
          test -f "$sdk/lib/toolchain/toka_package.py"
          "$sdk/bin/toka" --version | grep -F '1.0.0-rc.4'
          "$sdk/bin/tokac" --version | grep -F '1.0.0-rc.4'
          echo "$sdk/bin" >> "$GITHUB_PATH"
          echo "TOKA=$sdk/bin/toka" >> "$GITHUB_ENV"
          echo "TOKAC=$sdk/bin/tokac" >> "$GITHUB_ENV"
          echo "TOKA_LIB=$sdk/lib" >> "$GITHUB_ENV"

      - name: Resolve and build GUI consumer from a fresh cache
        working-directory: registry_gui_consumer
        run: |
          set -euo pipefail
          rm -rf target .toka
          rm -f .toka_build_exe
          cp package.lock "$RUNNER_TEMP/registry-gui-package.lock"
          python3 - <<'PY'
          from pathlib import Path

          lines = Path("package.lock").read_text(encoding="utf-8").splitlines()
          if len(lines) != 3 or lines[0] != "toka-lock-v1":
              raise SystemExit("GUI consumer lock must contain exactly two packages")
          entries = {fields[1]: fields for fields in (line.split("\t") for line in lines[1:])}
          if set(entries) != {"gui", "unicode"}:
              raise SystemExit("GUI consumer lock must contain only gui and unicode")
          expected_gui = [
              "package", "gui", "registry", "gui", "0.1.0",
              "b17fb7d4ce6bcb8c3a533216e40ca2c63ab95e0263ceffac8e2636d2f97ce85d",
              "eacbb69299afb7f1e6183c27cc9a54c44b2c75a489c6e3e38cedbb0999d5d77e",
              "unicode",
          ]
          if entries["gui"] != expected_gui:
              raise SystemExit("GUI consumer does not lock the exact GUI 0.1.0 release")
          expected_unicode = [
              "package", "unicode", "registry", "unicode", "0.1.1",
              "c68569e6efbd9eb9bf85226eca68de3a0187d4300e320aeb13857be73b5ad28a",
              "8c82ff393812d1ddd9a8b1f6d71d8ab49863a68b6193af1d784ea722e052fe76",
              "-",
          ]
          if entries["unicode"] != expected_unicode:
              raise SystemExit("GUI consumer does not lock the exact Unicode 0.1.1 release")
          PY
          toka fetch
          cmp package.lock "$RUNNER_TEMP/registry-gui-package.lock"
          test -f .toka/packages/gui-0.1.0/LICENSE
          test -f .toka/packages/gui-0.1.0/lib/official/gui.tk
          test -f .toka/packages/gui-0.1.0/lib/official/gui/text.tk
          test -f .toka/packages/gui-0.1.0/native/toka_gui.m
          test -f .toka/packages/unicode-0.1.1/LICENSE
          test -f .toka/packages/unicode-0.1.1/LICENSE-UNICODE
          test -f .toka/packages/unicode-0.1.1/lib/official/unicode.tk
          test -z "$(find .toka/packages/gui-0.1.0 .toka/packages/unicode-0.1.1 -name '._*' -print -quit)"
          gui_archive_sha="$(awk -F '\t' '$1 == "package" && $2 == "gui" { print $6 }' package.lock)"
          unicode_archive_sha="$(awk -F '\t' '$1 == "package" && $2 == "unicode" { print $6 }' package.lock)"
          test "$(find .toka/cache/archives -type f | wc -l | tr -d ' ')" = 2
          test -f ".toka/cache/archives/$gui_archive_sha.tar.gz"
          test -f ".toka/cache/archives/$unicode_archive_sha.tar.gz"
          echo "$gui_archive_sha  .toka/cache/archives/$gui_archive_sha.tar.gz" | shasum -a 256 --check
          echo "$unicode_archive_sha  .toka/cache/archives/$unicode_archive_sha.tar.gz" | shasum -a 256 --check
          toka build
          cmp package.lock "$RUNNER_TEMP/registry-gui-package.lock"
          test -n "$(find .toka/build/native -type f -name 'toka_gui-*.o' -print -quit)"
          test -x target/debug/registry_gui_consumer
          ./target/debug/registry_gui_consumer
          otool -L target/debug/registry_gui_consumer | grep -F 'AppKit.framework/'
          otool -L target/debug/registry_gui_consumer | grep -F 'Metal.framework/'
          otool -L target/debug/registry_gui_consumer | grep -F 'QuartzCore.framework/'

      - name: Replay GUI and Unicode locks offline from archives only
        working-directory: registry_gui_consumer
        run: |
          set -euo pipefail
          test "$(find .toka/cache/archives -type f | wc -l | tr -d ' ')" = 2
          rm -rf target .toka/packages .toka/build .toka/staging
          rm -f .toka_build_exe
          test ! -e target
          test ! -e .toka/packages
          test ! -e .toka/build
          test ! -e .toka_build_exe
          test "$(find .toka -type f | wc -l | tr -d ' ')" = 2
          TOKA_OFFLINE=1 toka fetch
          cmp package.lock "$RUNNER_TEMP/registry-gui-package.lock"
          test -f .toka/packages/gui-0.1.0/lib/official/gui.tk
          test -f .toka/packages/gui-0.1.0/lib/official/gui/text.tk
          test -f .toka/packages/gui-0.1.0/native/toka_gui.m
          test -f .toka/packages/unicode-0.1.1/lib/official/unicode.tk
          test ! -e .toka/build/native
          TOKA_OFFLINE=1 toka build
          cmp package.lock "$RUNNER_TEMP/registry-gui-package.lock"
          test -n "$(find .toka/build/native -type f -name 'toka_gui-*.o' -print -quit)"
          test -x target/debug/registry_gui_consumer
          ./target/debug/registry_gui_consumer
          otool -L target/debug/registry_gui_consumer | grep -F 'AppKit.framework/'
          otool -L target/debug/registry_gui_consumer | grep -F 'Metal.framework/'
          otool -L target/debug/registry_gui_consumer | grep -F 'QuartzCore.framework/'

  registry-redis-consumer:
    name: Redis registry consumer (linux-x64, rc5)
    runs-on: ubuntu-22.04
